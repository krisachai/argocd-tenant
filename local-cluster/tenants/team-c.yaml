apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-c
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: 168-etax
  source:
    path: 'apps'
    repoURL: https://github.com/krisachai/argocd-team-c.git
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: 168-etax
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true